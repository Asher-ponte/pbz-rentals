name: Import tent photo chunks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-tent-photos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-tent-photos
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download, verify, and commit photo chunks
        env:
          ARCHIVE_SHA256: f36730a6c0373e0c8dbb1add0e10ae7163c1ee868d632276b4efcaccc734c7b8
        run: |
          set -euo pipefail
          mkdir -p /tmp/chunks
          if ! curl -fsSL -o /tmp/chunks.tgz https://litter.catbox.moe/s99hhb.gz; then
            curl -fsSL -o /tmp/chunks.tgz https://tmpfiles.org/dl/1788629581.105060761ad2f0e8/w7wSkotL4GZi/tent-photo-chunks.tar.gz
          fi
          echo "$ARCHIVE_SHA256  /tmp/chunks.tgz" | sha256sum -c -
          tar -C /tmp/chunks -xzf /tmp/chunks.tgz
          python3 - <<'PY'
          import hashlib, pathlib
          expected = {
            "tent-2x2.b64.p1": "843edd7cc225baa041d9ca1a699424f55e83a5f7a2fb00ba059b237dd60d35be",
            "tent-2x2.b64.p2": "f0c206eb284d81ddcfef6c0b831da512fb00ae75ccffa5de2937d79c3e1f72c6",
            "tent-2x2.b64.p3": "a5e2595593b9f74c7f77c95c4fd1d3db690910daa146b2da890e7ec7c066146f",
            "tent-2x2.b64.p4": "da5de361a0c245ec5e7db6da394bc0bc9b6eeb7d752ee9a263be5fe8411f260e",
            "tent-2x2.b64.p5": "2a270898b136c3674637f016078accbe6559a2f2f9f694f9e150288dc764a9bc",
            "tent-3x3.b64.p1": "5e96f9239f644ea4a89d11737f031fda7ac55d8c58965b6b782c36ba7c7e3cce",
            "tent-3x3.b64.p2": "2174642e58bae41d08010ccb3b230d2da3262574dd495b90d821e808c07f8248",
            "tent-3x3.b64.p3": "79ef4a49b3ac66f015353d4893eb6583354f77ff85ed99b5b8ffeea8dba86196",
            "tent-3x3.b64.p4": "099972b5ac799bab33176464dcae4f8c749231e41c6b736002288bd8678fec62",
          }
          root = pathlib.Path("/tmp/chunks")
          for name, digest in expected.items():
            got = hashlib.sha256((root / name).read_bytes()).hexdigest()
            if got != digest:
              raise SystemExit(f"checksum mismatch for {name}: {got}")
          print("all chunk checksums ok")
          PY
          mkdir -p scripts/photos
          cp /tmp/chunks/tent-2x2.b64.p1 /tmp/chunks/tent-2x2.b64.p2 /tmp/chunks/tent-2x2.b64.p3 /tmp/chunks/tent-2x2.b64.p4 /tmp/chunks/tent-2x2.b64.p5 /tmp/chunks/tent-3x3.b64.p1 /tmp/chunks/tent-3x3.b64.p2 /tmp/chunks/tent-3x3.b64.p3 /tmp/chunks/tent-3x3.b64.p4 scripts/photos/
          rm -f .github/workflows/import-tent-photos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/photos/tent-2x2.b64.p1 scripts/photos/tent-2x2.b64.p2 scripts/photos/tent-2x2.b64.p3 scripts/photos/tent-2x2.b64.p4 scripts/photos/tent-2x2.b64.p5 scripts/photos/tent-3x3.b64.p1 scripts/photos/tent-3x3.b64.p2 scripts/photos/tent-3x3.b64.p3 scripts/photos/tent-3x3.b64.p4
          git add -u .github/workflows/import-tent-photos.yml
          git commit -m "Add catalog photo chunks for 2x2 and 3x3 tents"
          git push
