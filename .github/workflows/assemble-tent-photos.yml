name: assemble-tent-photos
on:
  push:
    paths:
      - "scripts/photos/.staging/**"
      - ".github/workflows/assemble-tent-photos.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check READY marker
        id: ready
        run: |
          if [ -f scripts/photos/.staging/READY ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Staging incomplete; waiting for READY"
          fi
      - name: Concatenate staging parts into catalog photo chunks
        if: steps.ready.outputs.ok == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("scripts/photos")
          st = root / ".staging"
          manifest = json.loads((st / "manifest.json").read_text())
          for item in manifest:
              data = b"".join((st / part).read_bytes() for part in item["parts"])
              if len(data) != item["size"]:
                  raise SystemExit(f"size mismatch {item['name']}: {len(data)} != {item['size']}")
              dest = root / item["name"]
              dest.write_bytes(data)
              print(f"wrote {dest} {len(data)}")
          PY
      - name: Commit assembled files and remove staging
        if: steps.ready.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/photos/tent-3x45.b64.p1 scripts/photos/tent-3x45.b64.p2 \
                  scripts/photos/tent-3x45.b64.p3 scripts/photos/tent-3x45.b64.p4 \
                  scripts/photos/tent-sizes.b64.p1 scripts/photos/tent-sizes.b64.p2 \
                  scripts/photos/tent-sizes.b64.p3 scripts/photos/tent-sizes.b64.p4 \
                  scripts/photos/tent-nearby.b64.p1 scripts/photos/tent-nearby.b64.p2
          git rm -r scripts/photos/.staging
          git rm .github/workflows/assemble-tent-photos.yml
          git commit -m "Add catalog photo chunks for tent sizes"
          git push
